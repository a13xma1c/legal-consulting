# Install with: uv run pre-commit install   (or: pipx install pre-commit)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: isort-tests
        name: isort (tests)
        entry: uv run isort tests --profile black -l 100
        language: system
        pass_filenames: false
      - id: pylint
        name: pylint
        entry: uv run pylint app config.py wsgi.py
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy (tests)
        entry: uv run mypy
        language: system
        pass_filenames: false
      - id: migrations-in-sync
        name: models match migrations
        entry: uv run pytest -q -p no:playwright tests/test_migrations.py
        language: system
        pass_filenames: false
