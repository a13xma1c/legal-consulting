[project]
name = "legalconsulting"
version = "1.0.0"
description = "Legal consulting platform: consultations, blog, community forum and AI legal assistant."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-login>=0.6",
    "flask-wtf>=1.2",
    "wtforms>=3.1",
    "email-validator>=2.0",
    "flask-bcrypt>=1.0",
    "markdown>=3.5",
    "bleach>=6.0",
    "anthropic>=0.40",
    "gunicorn>=21.0",
    "werkzeug>=3.1",
    "flask-migrate>=4.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pylint>=3.0",
    "mypy>=1.10",
    "pytest-playwright>=0.5",
    "playwright>=1.56",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
python_version = "3.10"
files = ["tests"]
follow_imports = "silent"
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["e2e: browser end-to-end tests (require Playwright browsers)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app", "config"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.pylint.main]
ignore = ["tests"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
    "too-many-ancestors",
    "cyclic-import",
    "duplicate-code",
]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8
max-locals = 20
max-returns = 8
