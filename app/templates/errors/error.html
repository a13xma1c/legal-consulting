{% extends "base.html" %}
{% block title %}{{ code }} {{ title }} - {{ site_name }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-gold">{{ code }}</div>
    <h1 class="fw-bold">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a href="{{ url_for('main.home') }}" class="btn btn-navy mt-3"><i class="bi bi-house"></i> Back to home</a>
</div>
{% endblock %}
