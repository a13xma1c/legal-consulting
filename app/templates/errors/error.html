{% extends "base.html" %}
{% block title %}{{ code }} {{ title }} - {{ site_name }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-gold">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a href="{{ url_for('main.home') }}" class="btn btn-filled mt-3">{{ icon('home') }} Back to home</a>
</div>
{% endblock %}
