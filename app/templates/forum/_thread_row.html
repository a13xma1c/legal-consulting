<a href="{{ url_for('forum.thread', slug=t.slug) }}" class="list-group-item list-group-item-action py-3">
    <div class="d-flex justify-content-between align-items-start gap-3">
        <div class="flex-grow-1">
            <div class="fw-semibold text-navy">
                {% if t.pinned %}<i class="bi bi-pin-angle-fill text-gold" title="Pinned"></i>{% endif %}
                {% if t.locked %}<i class="bi bi-lock-fill text-muted" title="Locked"></i>{% endif %}
                {{ t.title }}
                {% if t.has_lawyer_reply %}<span class="badge bg-gold text-navy ms-1" title="A lawyer has replied"><i class="bi bi-patch-check-fill"></i> Lawyer replied</span>{% endif %}
            </div>
            <small class="text-muted">{% if show_board %}{{ t.board.name }} · {% endif %}by {{ t.author.display_name }} · {{ t.created_at|timeago }}</small>
        </div>
        <div class="text-end small text-muted text-nowrap">
            <div><i class="bi bi-chat"></i> {{ t.reply_count }}</div>
            <div><i class="bi bi-eye"></i> {{ t.views }}</div>
        </div>
    </div>
</a>
